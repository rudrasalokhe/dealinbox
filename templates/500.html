<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service temporarily unavailable — DealInbox</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f7f7f5;color:#16161a;font-family:Inter,system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
    .card{max-width:460px;background:#fff;border:1px solid #e6e6e2;border-radius:14px;padding:32px;text-align:center;box-shadow:0 6px 20px rgba(20,20,25,.08)}
    .code{font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.1em;color:#b3b3ba;margin-bottom:10px}
    h1{margin:0 0 10px;font-size:22px;letter-spacing:-.02em}
    p{color:#57575f;line-height:1.7;margin:0 0 22px;font-size:13.5px}
    .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
    a{display:inline-block;padding:9px 15px;border-radius:10px;text-decoration:none;font-size:13px;font-weight:550}
    .pri{background:#16161a;color:#fff}.sec{background:#fff;color:#16161a;border:1px solid #e6e6e2}
  </style>
</head>
<body>
  <div class="card">
    <div class="code">ERROR 500</div>
    <h1>Something went wrong</h1>
    <p>DealInbox is temporarily unavailable. Please refresh in a few seconds. If this continues, contact support and we'll help right away.</p>
    <div class="btns">
      <a class="pri" href="/">Reload homepage</a>
      <a class="sec" href="mailto:support@dealinbox.in">Contact support</a>
    </div>
  </div>
</body>
</html>
