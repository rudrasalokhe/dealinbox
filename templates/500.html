<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08080e">
  <title>Service temporarily unavailable — DealInbox</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#08080e;color:#eeeef0;font-family:Inter,system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
    .card{max-width:460px;background:rgba(255,255,255,.03);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:32px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5)}
    .code{font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.1em;color:#44445a;margin-bottom:10px}
    h1{margin:0 0 10px;font-size:22px;letter-spacing:-.02em}
    p{color:#9a9ab0;line-height:1.7;margin:0 0 22px;font-size:13.5px}
    .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
    a{display:inline-block;padding:9px 15px;border-radius:12px;text-decoration:none;font-size:13px;font-weight:550;transition:all .15s ease}
    .pri{background:linear-gradient(135deg,#4f6ef7,#7c5ef7);color:#fff;box-shadow:0 2px 12px rgba(79,110,247,.3)}
    .pri:hover{box-shadow:0 4px 20px rgba(79,110,247,.5)}
    .sec{background:rgba(255,255,255,.04);color:#eeeef0;border:1px solid rgba(255,255,255,.08)}
    .sec:hover{background:rgba(255,255,255,.08)}
  </style>
</head>
<body>
  <div class="card">
    <div class="code">ERROR 500</div>
    <h1>Something went wrong</h1>
    <p>DealInbox is temporarily unavailable. Please refresh in a few seconds. If this continues, contact support and we'll help right away.</p>
    <div class="btns">
      <a class="pri" href="/">Reload homepage</a>
      <a class="sec" href="mailto:support@dealinbox.in">Contact support</a>
    </div>
  </div>
</body>
</html>
